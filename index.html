<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIA Colombo – Flights</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
  header{padding:16px 24px;background:#1e293b}
  .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;padding:16px}
  .card{background:#1e293b;border-radius:10px;padding:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #334155}
  small{color:#94a3b8}
</style>
</head>
<body>
<header><h2>Bandaranaike Intl (CMB)</h2><small id="upd">Loading…</small></header>
<div class="wrap">
  <div class="card"><h3>Arrivals</h3><table id="arr"></table></div>
  <div class="card"><h3>Departures</h3><table id="dep"></table></div>
</div>
<script>
const API = 'YOUR_EXEC_URL';
const fmt = ts => ts ? new Date(ts*1000).toLocaleString('en-GB',
  {timeZone:'Asia/Colombo',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}) : '-';
const render = (id, rows, label) => {
  document.getElementById(id).innerHTML =
    `<tr><th>Flight</th><th>${label}</th><th>Time</th><th>Status</th></tr>` +
    rows.map(r => `<tr><td>${r.flight||'-'}</td><td>${r.city||'-'} (${r.code||''})</td>
      <td>${fmt(r.scheduled)}</td><td>${r.status||'-'}</td></tr>`).join('');
};
async function load(){
  try{
    const d = await (await fetch(API)).json();
    render('arr', d.arrivals, 'From');
    render('dep', d.departures, 'To');
    document.getElementById('upd').textContent = 'Updated ' + new Date(d.updated).toLocaleTimeString();
  }catch(e){ document.getElementById('upd').textContent = 'Failed to load data'; }
}
load(); setInterval(load, 300000);
</script>
</body>
</html>
